name: bpg_retail
description: bpg_retail 

publish_to: 'none'

version: 1.0.1+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  dio: ^5.4.0
  injectable: ^2.3.2
  auto_route: ^7.8.4
  flutter_bloc: ^8.1.3
  dartx: ^1.2.0
  freezed_annotation: ^2.4.1
  intl: ^0.19.0
  json_annotation: ^4.8.1
  pin_code_fields: ^8.0.1
  dartz: ^0.10.1
  provider: ^6.1.1
  get_it: ^7.6.7
  flutter_easyloading: ^3.0.5
  loading_animation_widget: ^1.2.0+4
  top_snackbar_flutter: ^3.1.0
  dropdown_button2: ^2.3.9
  flutter_datetime_picker_plus: ^2.1.0
  file_picker: ^6.1.1
  geocoding: ^2.1.1
  location: ^5.0.0-dev.8
  geolocator: ^10.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  carousel_slider: ^5.0.0
  dots_indicator: ^3.0.0
  flutter_slidable: ^3.0.1
  flutter_rating_bar: ^4.0.1
  html: ^0.15.4
  video_player: ^2.8.5
  chewie: ^1.7.5
  firebase_core: ^2.15.1
  firebase_messaging: ^14.2.1
  # firebase_analytics: ^10.4.1
  firebase_database: ^10.2.1
  overlay_support: ^2.1.0
  infinite_scroll_pagination: ^4.0.0
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^17.0.0
  google_maps_flutter: ^2.5.0
  upgrader: ^9.0.0
  qr_flutter: ^4.1.0
  image_gradient: ^0.0.2
  path_provider: ^2.1.5
  share_plus: ^10.0.0
  permission_handler: ^11.3.1
  qr_code_scanner_plus: ^2.0.6
  dotted_border: ^2.1.0
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  image: ^4.0.14
  # image_gallery_saver: ^2.0.3
  device_info_plus: ^9.1.2
  qr_code_dart_scan: ^0.8.3
  flutter_html: ^3.0.0-beta.2
  logger: ^2.5.0
  syncfusion_flutter_datepicker: ^27.2.5
  photo_view: ^0.15.0






  flutter_localizations:
    sdk: flutter
  curl_logger_dio_interceptor: ^1.0.0
  fluttertoast: ^8.2.11
  package_info_plus: ^4.2.0
  url_launcher: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  freezed: ^2.4.6
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  auto_route_generator: ^7.3.2
  build_runner: ^2.4.8
  flutter_gen_runner: 5.3.1

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    enable: true
    outputs:
      class_name: Assets
      package_parameter_enabled: false
      style: dot-delimiter

  font:
    enable: true

    
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/jsons/
    - assets/lang/

  fonts:
    - family: Helvetica Neu
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 300
